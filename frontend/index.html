<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>CES - Giai đoạn 2 (Fix Đồng Bộ)</title>
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        #editor-wrapper { margin-top: 20px; border: 1px solid #ccc; }
        #editor-container { height: 400px; font-size: 16px; }
        .status-bar { padding: 10px; background: #eef2f5; border-radius: 5px; font-weight: bold; }
        .connected { color: #28a745; }
        .disconnected { color: #dc3545; }
    </style>
</head>
<body>
    <h2>Hệ thống Soạn thảo Cộng tác (Giai đoạn 2)</h2>
    <div class="status-bar" id="status">Trạng thái: <span class="disconnected">Đang kết nối Localhost...</span></div>

    <div id="editor-wrapper">
        <div id="editor-container"></div>
    </div>

    <script src="https://cdn.quilljs.com/1.3.7/quill.js"></script>

    <script type="module">
        // BÍ QUYẾT Ở ĐÂY: Thêm ?deps=yjs@13.6.1 để ép đồng bộ lõi
        import * as Y from 'https://esm.sh/yjs@13.6.1';
        import { WebsocketProvider } from 'https://esm.sh/y-websocket@1.5.0?deps=yjs@13.6.1';
        import { QuillBinding } from 'https://esm.sh/y-quill@0.1.5?deps=yjs@13.6.1';
        import QuillCursors from 'https://esm.sh/quill-cursors@3.1.0';

        // Đăng ký module con trỏ
        Quill.register('modules/cursors', QuillCursors);

        // Khởi tạo Yjs
        const doc = new Y.Doc();
        
        // Kết nối Server Local 1234
        const provider = new WebsocketProvider('ws://localhost:1234', 'room-ces-chuan', doc);

        // Xử lý trạng thái hiển thị
        provider.on('status', event => {
            const statusSpan = document.querySelector('#status span');
            if(event.status === 'connected') {
                statusSpan.textContent = 'Đã kết nối Server Local 1234!';
                statusSpan.className = 'connected';
            } else {
                statusSpan.textContent = 'Mất kết nối / Đang thử lại...';
                statusSpan.className = 'disconnected';
            }
        });

        // Khởi tạo Quill
        const yText = doc.getText('quill');
        const quill = new Quill('#editor-container', {
            modules: {
                cursors: true,
                toolbar: [
                    [{ header: [1, 2, false] }],
                    ['bold', 'italic', 'underline'],
                    ['image', 'code-block'],
                    [{ list: 'ordered' }, { list: 'bullet' }]
                ]
            },
            placeholder: 'Bắt đầu soạn thảo cùng đồng đội...',
            theme: 'snow'
        });

        // Liên kết Yjs và Quill (Nơi phép màu xảy ra)
        const binding = new QuillBinding(yText, quill, provider.awareness);

        // Gắn tên và màu ngẫu nhiên cho con trỏ
        provider.awareness.setLocalStateField('user', {
            name: 'Huy ' + Math.floor(Math.random() * 100),
            color: '#' + Math.floor(Math.random()*16777215).toString(16)
        });
    </script>
</body>
</html>
