<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CES — Collaborative Editor</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Quill editor CSS -->
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
    <!-- CSS chung của ứng dụng -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app-shell">

    <!-- NAVBAR -->
    <header class="ces-navbar">
        <span class="ces-brand">
            <i class="bi bi-file-earmark-text-fill me-1"></i>CES
        </span>
        <div class="flex-grow-1"></div>
        <!-- Sẽ được điền bởi app.js sau khi xác thực -->
        <div id="auth-section">
            <a href="login.html" class="btn btn-sm btn-primary">Đăng nhập</a>
        </div>
    </header>

    <div class="ces-body">

        <!-- SIDEBAR TRÁI -->
        <aside class="ces-sidebar">
            <div class="ces-sidebar-header">
                <button class="btn btn-primary btn-sm w-100" id="btn-create-doc">
                    <i class="bi bi-plus-lg me-1"></i>Tài liệu mới
                </button>
                <button class="btn btn-outline-secondary btn-sm w-100" id="btn-join-doc">
                    <i class="bi bi-key me-1"></i>Nhập mã mời
                </button>
            </div>
            <!-- Danh sách tài liệu — điền bởi app.js -->
            <ul class="doc-list" id="doc-list"></ul>
        </aside>

        <!-- EDITOR -->
        <main class="ces-editor">
            <!-- Quill sẽ gắn vào div#editor -->
            <div id="editor"></div>
        </main>

        <!-- PANEL PHẢI -->
        <aside class="ces-right">

            <!-- Tabs Online / Bạn bè -->
            <div class="rp-tabs">
                <button class="rp-tab active" data-tab="online">
                    <i class="bi bi-circle-fill text-success" style="font-size:7px;"></i>
                    Trực tuyến
                </button>
                <button class="rp-tab" data-tab="friends">
                    <i class="bi bi-people"></i>Bạn bè
                    <span id="pending-badge" class="badge bg-danger hidden"
                          style="font-size:9px;padding:2px 5px;">0</span>
                </button>
            </div>

            <!-- Tab: Người đang online -->
            <div id="tab-online" class="rp-panel">
                <div class="panel-label">Đang soạn thảo</div>
                <div id="user-list"></div>
            </div>

            <!-- Tab: Bạn bè -->
            <div id="tab-friends" class="rp-panel hidden">
                <!-- Tìm kiếm người dùng -->
                <div class="friend-search-row">
                    <input id="friend-search-input" type="text"
                           placeholder="Tìm email…" autocomplete="off">
                    <button id="btn-friend-search">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <ul id="search-results" class="friend-list"></ul>

                <!-- Lời mời kết bạn đang chờ -->
                <div class="panel-label" id="pending-label" style="display:none;">
                    <i class="bi bi-bell-fill text-warning me-1"></i>Lời mời kết bạn
                </div>
                <ul id="pending-list" class="friend-list"></ul>

                <!-- Danh sách bạn bè -->
                <div class="panel-label">
                    <i class="bi bi-people me-1"></i>Bạn bè của tôi
                </div>
                <ul id="friend-list" class="friend-list"></ul>
            </div>

        </aside>
    </div>

    <!-- STATUS BAR -->
    <footer class="ces-statusbar">
        <span id="save-status">
            <i class="bi bi-wifi me-1"></i>Đang kết nối...
        </span>
    </footer>

</div>

<!-- Toast thông báo toàn cục -->
<div id="ces-toast" class="ces-toast"></div>

<!-- SCRIPTS -->
<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Socket.IO client -->
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<!-- Logic chính của ứng dụng (ES Module vì dùng import Yjs / Quill) -->
<script type="module" src="app.js"></script>

</body>
</html>
