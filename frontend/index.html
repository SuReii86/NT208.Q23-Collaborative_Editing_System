<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Hệ Thống Soạn Thảo Cộng Tác (CES)</title>
    <link rel="stylesheet" href="https://cdn.quilljs.com/1.3.7/quill.snow.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand">CES Editor</div>
        <div class="nav-user">
            <div class="avatar"></div>
            <button class="btn-logout">Đăng xuất</button>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <button class="btn-new-doc">+ Tài liệu mới</button>
            <ul class="doc-list">
                <li class="doc-item">📄 Dự án cuối kỳ</li>
                <li class="doc-item">📄 Ghi chú họp nhóm</li>
            </ul>
        </aside>

        <main class="editor-area">
            <div id="editor"></div>
        </main>

        <aside class="right-panel">
            <h4>Trực tuyến</h4>
            <div id="user-list">
                </div>
        </aside>
    </div>

    <footer class="status-bar">
        <span id="save-status">Đã lưu tất cả thay đổi</span>
    </footer>

    <script type="module">
    import * as Y from 'https://esm.sh/yjs@13.6.15';
    import { WebsocketProvider } from 'https://esm.sh/y-websocket@1.4.5?deps=yjs@13.6.15';
    import { QuillBinding } from 'https://esm.sh/y-quill@0.1.5?deps=yjs@13.6.15';
    import Quill from 'https://esm.sh/quill@1.3.7';
    import QuillCursors from 'https://esm.sh/quill-cursors@3.1.2';

    const doc = new Y.Doc();
    
    // Đảm bảo tên phòng 'my-doc' là duy nhất và giống nhau ở cả hai tab
    const provider = new WebsocketProvider('ws://localhost:1234', 'my-doc', doc);
    const yText = doc.getText('content');

    Quill.register('modules/cursors', QuillCursors);
    
    const quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            cursors: true,
            toolbar: [
                [{ header: [1, 2, false] }],
                ['bold', 'italic', 'underline'],
                ['image', 'code-block']
            ]
        },
        placeholder: 'Bắt đầu soạn thảo...'
    });

    // Kết nối yText với Quill
    const binding = new QuillBinding(yText, quill, provider.awareness);

    const userName = 'Thành viên ' + Math.floor(Math.random() * 100);
    provider.awareness.setLocalStateField('user', {
        name: userName,
        color: '#' + Math.floor(Math.random()*16777215).toString(16)
    });

    const userListDiv = document.getElementById('user-list');
    provider.awareness.on('change', () => {
        const states = provider.awareness.getStates();
        userListDiv.innerHTML = '';
        states.forEach(state => {
            if (state.user) {
                userListDiv.innerHTML += `
                    <div class="user-online-item">
                        <span class="status-dot" style="background-color: ${state.user.color}"></span>
                        ${state.user.name}
                    </div>`;
            }
        });
    });
</script>
</body>
</html>
