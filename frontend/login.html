<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập — CES</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- CSS chung của ứng dụng -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <!-- Thương hiệu -->
        <div class="auth-brand">
            <i class="bi bi-file-earmark-text-fill"></i>CES
        </div>
        <p class="auth-sub">Hệ thống soạn thảo cộng tác</p>

        <!-- Tab chuyển đổi Đăng nhập / Đăng ký -->
        <div class="auth-tab-bar">
            <button class="auth-tab active" id="tab-login">Đăng nhập</button>
            <button class="auth-tab"        id="tab-register">Đăng ký</button>
        </div>

        <!-- Form -->
        <form id="auth-form" novalidate>
            <!-- Email -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:13px;">Email</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" id="email" class="form-control"
                           placeholder="example@email.com"
                           required autocomplete="email">
                </div>
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
                <label class="form-label fw-semibold" style="font-size:13px;">Mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" id="password" class="form-control"
                           placeholder="Tối thiểu 6 ký tự"
                           required minlength="6" autocomplete="current-password">
                </div>
            </div>

            <!-- Nhập lại mật khẩu (chỉ hiện khi Đăng ký) -->
            <div class="mb-3" id="confirm-group" style="display:none;">
                <label class="form-label fw-semibold" style="font-size:13px;">Nhập lại mật khẩu</label>
                <div class="input-group">
                    <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                    <input type="password" id="confirm-password" class="form-control"
                           placeholder="Nhập lại mật khẩu" autocomplete="new-password">
                </div>
            </div>

            <!-- Thông báo lỗi / thành công -->
            <div id="alert-box" class="alert py-2 px-3" style="font-size:13px;display:none;"></div>

            <!-- Nút submit -->
            <button type="submit" class="btn btn-primary btn-auth" id="submit-btn">
                <i class="bi bi-box-arrow-in-right me-1"></i>Vào Trình Soạn Thảo
            </button>
        </form>

        <!-- Chuyển mode -->
        <p class="auth-switch">
            Chưa có tài khoản? <a href="#" id="toggle-mode">Đăng ký ngay</a>
        </p>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Logic đăng nhập / đăng ký -->
    <script src="login.js"></script>
</body>
</html>
